services:
  web:
    container_name: jlpt-vocabulary-web
    image: jlpt-vocabulary-web:local
    build:
      context: .
      dockerfile: web/Dockerfile
    ports:
      - "127.0.0.1:${JLPT_WEB_PORT:-8081}:8080"
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
