services:
  web:
    container_name: jlpt-vocabulary-web
    image: jlpt-vocabulary-web:local
    build:
      context: .
      dockerfile: web/Dockerfile
      args:
        VCS_REF: "${JLPT_GIT_REVISION:-unknown}"
    ports:
      - "127.0.0.1:${JLPT_WEB_PORT:-8081}:8080"
    networks:
      default:
      edge:
        aliases:
          - jlpt-vocabulary-web
    restart: unless-stopped
    labels:
      net.mangagaki.deployment.branch: main
      org.opencontainers.image.revision: "${JLPT_GIT_REVISION:-unknown}"
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

networks:
  edge:
    external: true
    name: jjs-edge
