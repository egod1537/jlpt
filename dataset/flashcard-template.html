<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>N1 유의표현 어휘</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;700&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
html, body { background: #0f1218 !important; }
:root {
  --teal:#4ab8bf; --teal-dark:#1e5f65; --teal-btn:#2e9098;
  --bg:#0f1218; --surface:#181d26; --surface2:#1f2530; --border:#2a313d;
  --dark-btn:#1f2530; --text:#dde2ec; --text-muted:#5a6272;
  --gold:#f0b429; --orange:#f97316; --orange-muted:#c2622a; --green:#3cb371;
}
* { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
body {
  font-family:'Noto Sans KR','Helvetica Neue',sans-serif; color:var(--text);
  min-height:100dvh; height:100dvh; display:flex; flex-direction:column;
  max-width:480px; margin:0 auto; overflow:hidden;
}
.screen { display:none; flex:1; min-height:0; flex-direction:column; }
.screen.active { display:flex; }

/* ---------- 세트 선택 ---------- */
.select-wrap { flex:1; overflow-y:auto; padding:28px 18px max(28px, env(safe-area-inset-bottom)); }
.select-title { font-size:22px; font-weight:700; color:var(--teal); }
.select-sub { font-size:13px; color:var(--text-muted); margin:4px 0 22px; }
.sec-label { font-size:12px; font-weight:700; color:var(--text-muted); letter-spacing:.06em; margin:22px 0 10px; }
.set-grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
.set-btn {
  background:var(--surface); border:1.5px solid var(--border); border-radius:14px;
  padding:14px 12px; color:var(--text); font-family:inherit; font-size:15px; font-weight:500;
  cursor:pointer; text-align:left; transition:border-color .15s;
}
.set-btn:hover { border-color:var(--teal); }
.set-btn small { display:block; font-size:12px; color:var(--text-muted); margin-top:3px; font-weight:400; }
.set-btn.wide { grid-column:1 / -1; }
.set-btn.hero { background:var(--teal-dark); border-color:var(--teal); }
.set-btn.hero small { color:#9fd6da; }
.set-btn.gold small { color:var(--gold); }
.set-btn:disabled { opacity:.35; cursor:default; }

/* ---------- 학습 화면 ---------- */
.header { display:flex; align-items:center; gap:10px; padding:14px 16px 6px; flex-shrink:0; }
.btn-back { background:none; border:none; color:var(--text-muted); font-size:22px; cursor:pointer; padding:2px 6px; }
.header-title { flex:1; font-size:15px; font-weight:700; color:var(--text); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.counter { font-size:14px; color:var(--text-muted); font-variant-numeric:tabular-nums; }
.timer-bar { text-align:center; font-size:12px; color:var(--text-muted); font-variant-numeric:tabular-nums; padding:2px 0 4px; flex-shrink:0; }
.options-row { display:flex; justify-content:center; gap:14px; padding:8px 16px; flex-shrink:0; }
.opt-btn {
  width:42px; height:42px; border-radius:50%; border:1.5px solid var(--border);
  background:var(--surface); color:var(--text-muted); font-size:17px; cursor:pointer;
  display:flex; align-items:center; justify-content:center; font-family:inherit;
}
.opt-btn.on { border-color:var(--gold); color:var(--gold); }
.opt-btn.loop.on { border-color:var(--teal); color:var(--teal); }
.opt-count { font-size:13px; font-weight:700; color:var(--text); cursor:default; }

.main {
  flex:1; min-height:0; overflow-y:auto; display:flex; flex-direction:column;
  align-items:center; justify-content:center; padding:10px 20px;
}
.card-inner { width:100%; display:flex; flex-direction:column; align-items:center; }
.card-inner.swipe-left  { animation:swipeLeft .22s ease forwards; }
.card-inner.swipe-right { animation:swipeRight .22s ease forwards; }
@keyframes swipeLeft  { to { transform:translateX(-70px); opacity:0; } }
@keyframes swipeRight { to { transform:translateX(70px);  opacity:0; } }

.meta { font-size:12px; color:var(--text-muted); min-height:1.3em; margin-bottom:6px; }
.meta .stars { color:var(--orange-muted); letter-spacing:1px; }
.kanji-display {
  font-family:'Noto Sans JP',sans-serif; font-size:clamp(48px,16vw,80px);
  color:var(--teal); font-weight:300; text-align:center; line-height:1.25; word-break:break-word;
}
.kanji-display.long { font-size:clamp(34px,10vw,54px); }
.nuance-context {
  font-family:'Noto Sans KR',sans-serif; font-size:clamp(13px,3.8vw,15px);
  color:var(--gold); font-weight:500; text-align:center; margin-top:8px; min-height:1.2em;
}
.example {
  font-family:'Noto Sans JP',sans-serif; font-size:clamp(14px,4vw,17px); line-height:1.7;
  color:#8a93a3; text-align:center; margin-top:14px; max-width:100%; word-break:break-word;
}
.example .hl {
  color:var(--teal); text-decoration:underline; text-underline-offset:4px;
  text-decoration-thickness:1.5px; font-weight:400;
}
.ex-kr { font-size:clamp(12px,3.5vw,14px); color:var(--orange-muted); font-weight:400; margin-top:6px; line-height:1.5; }
.divider { width:60%; height:1px; background:var(--border); margin:18px 0 14px; }
.hint-area { max-height:35vh; overflow-y:auto; text-align:center; display:flex; flex-direction:column; gap:8px; }
.hint-text { visibility:hidden; opacity:0; font-size:clamp(14px,4vw,18px); min-height:1.4em; }
.hint-text.visible { visibility:visible; opacity:1; transition:opacity .18s ease; }
#hintKr, #hintRd { color:var(--orange); font-weight:500; }
#hintKr { font-family:'Noto Sans KR',sans-serif; font-size:clamp(15px,4.5vw,19px); }
#hintRd { font-family:'Noto Sans JP',sans-serif; font-size:clamp(14px,4vw,18px); }

/* 완료 화면 */
.done { display:none; flex:1; flex-direction:column; align-items:center; justify-content:center; padding:24px; gap:12px; }
.done.active { display:flex; }
.done-title { font-size:22px; font-weight:700; color:var(--teal); }
.done-stats { display:flex; gap:28px; margin:8px 0 18px; }
.done-stat { text-align:center; }
.done-stat b { display:block; font-size:28px; }
.done-stat span { font-size:12px; color:var(--text-muted); }
.done-stat.know b { color:var(--teal); }
.done-stat.study b { color:var(--gold); }
.done-time { font-size:13px; color:var(--text-muted); margin-top:-12px; margin-bottom:10px; }
.btn-restart-primary {
  width:100%; padding:16px; border-radius:14px; border:none; background:var(--teal-btn); color:white;
  font-size:17px; font-weight:700; cursor:pointer; font-family:inherit; transition:opacity .15s;
}
.btn-restart-primary:hover { opacity:.85; }
.btn-restart-secondary {
  width:100%; padding:13px; border-radius:14px; border:2px solid var(--border); background:transparent;
  color:var(--text-muted); font-size:14px; font-weight:500; cursor:pointer; font-family:inherit;
  transition:border-color .15s, color .15s;
}
.btn-restart-secondary:hover { border-color:var(--teal); color:var(--teal); }

/* 프로그레스 */
.progress-wrap { padding:6px 16px 4px; flex-shrink:0; }
.progress-track { height:5px; background:var(--surface2); border-radius:3px; overflow:hidden; }
.progress-fill { height:100%; width:0; background:var(--teal); transition:width .25s; }
.progress-label { display:flex; justify-content:space-between; font-size:11px; color:var(--text-muted); margin-top:4px; }

/* 하단 버튼 */
.bottom { flex-shrink:0; padding:8px 16px; padding-bottom:max(32px, env(safe-area-inset-bottom)); display:flex; flex-direction:column; gap:10px; }
.hint-btns, .action-btns { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
.btn-hint, .btn-action {
  border-radius:14px; font-family:inherit; font-weight:500; cursor:pointer;
  font-size:clamp(13px,3.5vw,16px); padding:clamp(12px,3vw,18px) 12px;
}
.btn-hint { background:var(--dark-btn); border:1.5px solid var(--border); color:var(--text); }
.btn-hint.revealed { background:var(--teal-dark); border-color:var(--teal); }
.btn-hint .jp { font-family:'Noto Sans JP',sans-serif; }
.btn-action { border:none; color:white; font-weight:700; }
.btn-study { background:#2a4a6e; }
.btn-study .ic { color:var(--gold); }
.btn-know { background:var(--teal-btn); }

kbd {
  display:none; margin-left:6px; padding:0 5px; border-radius:4px; font-family:inherit;
  font-size:10px; line-height:16px; vertical-align:middle; opacity:.55;
  border:1px solid currentColor;
}
@media (hover:hover) and (pointer:fine) { kbd { display:inline-block; } }

@media (max-height:700px) {
  .kanji-display { font-size:clamp(40px,12vw,60px); }
  .kanji-display.long { font-size:clamp(30px,9vw,46px); }
  .hint-area { max-height:25vh; }
  .btn-hint, .btn-action { padding:12px; }
  .options-row { padding:6px 16px; }
  .divider { margin:12px 0 10px; }
}
@media (max-width:360px) {
  .hint-btns, .action-btns { gap:6px; }
  .btn-hint, .btn-action { font-size:13px; }
}
</style>
</head>
<body>

<!-- ===== 세트 선택 ===== -->
<div class="screen active" id="selectScreen">
  <div class="select-wrap">
    <div class="select-title">N1 유의표현 예상 어휘</div>
    <div class="select-sub" id="selectSub"></div>

    <div class="set-grid" id="topSets"></div>

    <div class="sec-label">품사별</div>
    <div class="set-grid" id="posSets"></div>

    <div class="sec-label">50장 세트 (교재 순서 기준)</div>
    <div class="set-grid" id="chunkSets"></div>
  </div>
</div>

<!-- ===== 학습 ===== -->
<div class="screen" id="studyScreen">
  <div class="header">
    <button class="btn-back" onclick="goSelect()" aria-label="세트 선택으로">‹</button>
    <div class="header-title" id="headerTitle"></div>
    <div class="counter" id="counter">0 / 0</div>
  </div>
  <div class="timer-bar" id="timer">00:00</div>

  <div class="options-row" id="optionsRow">
    <button class="opt-btn" id="btnBookmark" onclick="toggleBookmark()" title="북마크">★</button>
    <button class="opt-btn loop" id="btnLoop" onclick="toggleLoop()" title="무한 반복: 모르는 카드를 라운드 끝에 다시 넣음">∞</button>
    <div class="opt-btn opt-count" id="remain" title="남은 카드">0</div>
    <button class="opt-btn" onclick="speak()" title="발음 듣기">🔊</button>
  </div>

  <div class="main" id="mainArea">
    <div class="card-inner" id="cardInner">
      <div class="meta" id="meta"></div>
      <div class="kanji-display" id="kanjiDisplay"></div>
      <div class="nuance-context" id="nuanceContext"></div>
      <div class="example" id="example"></div>
      <div class="divider"></div>
      <div class="hint-area">
        <div class="hint-text" id="hintKr"><div id="hintKrMain"></div><div class="ex-kr" id="hintExKr"></div></div>
        <div class="hint-text" id="hintRd"></div>
      </div>
    </div>
  </div>

  <div class="done" id="doneArea">
    <div class="done-title">라운드 완료</div>
    <div class="done-stats">
      <div class="done-stat know"><b id="doneKnow">0</b><span>알고있음</span></div>
      <div class="done-stat study"><b id="doneStudy">0</b><span>공부하겠음</span></div>
    </div>
    <div class="done-time" id="doneTime"></div>
    <button class="btn-restart-primary" id="btnRetry" onclick="restart(true)">✗ 모르는 것만 다시 <span id="retryCount"></span></button>
    <button class="btn-restart-secondary" onclick="restart(false)">처음부터 다시</button>
    <button class="btn-restart-secondary" onclick="goSelect()">세트 선택으로</button>
  </div>

  <div class="progress-wrap" id="progressWrap">
    <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
    <div class="progress-label"><span id="progDone">완료 0</span><span id="progLeft">남음 0</span></div>
  </div>

  <div class="bottom" id="bottomArea">
    <div class="hint-btns">
      <button class="btn-hint" id="btnKr" onclick="toggleHint('Kr')">한국어<kbd>Q</kbd></button>
      <button class="btn-hint" id="btnRd" onclick="toggleHint('Rd')"><span class="jp">ひらがな</span><kbd>W</kbd></button>
    </div>
    <div class="action-btns">
      <button class="btn-action btn-study" onclick="next('study')"><span class="ic">✎</span> 공부하겠음<kbd>A</kbd></button>
      <button class="btn-action btn-know" onclick="next('know')">✓ 알고있음<kbd>S</kbd></button>
    </div>
  </div>
</div>

自の【メソッド】で英語を教えている。","exKr":"독자적인 방법으로 영어를 가르치고 있다."},{"n":266,"jp":"モラル","rd":"モラル","kr":"윤리, 도덕","pos":"가타카나","star":0,"ex":"ネット社会では利用者の【モラル】が問われる。","exKr":"인터넷 사회에서는 이용자의 도덕성이 요구된다."},{"n":267,"jp":"ラフ","rd":"ラフ","kr":"러프, 거침, 조잡함","pos":"가타카나","star":0,"ex":"まず【ラフ】なスケッチを描いてみた。","exKr":"우선 대충 스케치를 그려 보았다."},{"n":268,"jp":"リーズナブル","rd":"リーズナブル","kr":"타당함, 적당함","pos":"가타카나","star":2,"ex":"この店は【リーズナブル】な値段でおいしい料理が食べられる。","exKr":"이 가게는 적당한 가격으로 맛있는 요리를 먹을 수 있다."}];

const POS_ORDER = ['명사','혼동명사','동사','イ형용사','ナ형용사','부사','가타카나'];
const BM_KEY = 'n1_yuui_79_84_bookmarks';

let pool = [], deck = [], idx = 0, studyList = [], knowList = [];
let loopMode = false, busy = false, setName = '';
let timerStart = 0, timerId = null;
let bookmarks = loadBookmarks();

/* ---------- 유틸 ---------- */
function shuffle(a) {
  a = a.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
function cardKey(w) { return w.jp + '|' + (w.nuance || ''); }
function loadBookmarks() {
  try { return new Set(JSON.parse(localStorage.getItem(BM_KEY) || '[]')); }
  catch (e) { return new Set(); }
}
function saveBookmarks() {
  try { localStorage.setItem(BM_KEY, JSON.stringify([...bookmarks])); } catch (e) {}
}
function fmt(ms) {
  const s = Math.floor(ms / 1000);
  return String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0');
}

/* ---------- 세트 선택 ---------- */
function setButton(container, label, sub, list, cls) {
  const b = document.createElement('button');
  b.className = 'set-btn' + (cls ? ' ' + cls : '');
  b.innerHTML = label + '<small>' + sub + '</small>';
  if (!list.length) b.disabled = true;
  b.onclick = () => startSet(label, list);
  container.appendChild(b);
}
function renderSelect() {
  const uniq = new Set(words.map(w => w.jp)).size;
  document.getElementById('selectSub').textContent =
    '교재 79~84쪽 · 단어 ' + uniq + '개 · 다의어 분리 후 카드 ' + words.length + '장';

  const top = document.getElementById('topSets'); top.innerHTML = '';
  setButton(top, '전체', words.length + '장', words, 'wide hero');
  const starred = words.filter(w => w.star > 0);
  const triple = words.filter(w => w.star >= 2);
  setButton(top, '교재 ★ 단어', starred.length + '장', starred, 'gold');
  setButton(top, '★★ 이상', triple.length + '장', triple, 'gold');
  const bm = words.filter(w => bookmarks.has(cardKey(w)));
  setButton(top, '북마크', bm.length ? bm.length + '장' : '없음', bm, 'wide');

  const ps = document.getElementById('posSets'); ps.innerHTML = '';
  POS_ORDER.forEach(p => {
    const l = words.filter(w => w.pos === p);
    if (l.length) setButton(ps, p, l.length + '장', l);
  });

  const cs = document.getElementById('chunkSets'); cs.innerHTML = '';
  for (let i = 0; i < words.length; i += 50) {
    const l = words.slice(i, i + 50);
    setButton(cs, 'Set ' + (i / 50 + 1), (i + 1) + '~' + (i + l.length) + ' · ' + l[0].jp + '…', l);
  }
}
function goSelect() {
  clearInterval(timerId);
  if (window.speechSynthesis) speechSynthesis.cancel();
  document.getElementById('studyScreen').classList.remove('active');
  document.getElementById('selectScreen').classList.add('active');
  renderSelect();
}
function startSet(name, list) {
  setName = name; pool = list.slice();
  document.getElementById('headerTitle').textContent = name;
  document.getElementById('selectScreen').classList.remove('active');
  document.getElementById('studyScreen').classList.add('active');
  beginRound(pool);
}

/* ---------- 라운드 ---------- */
function beginRound(list) {
  deck = shuffle(list); idx = 0; studyList = []; knowList = [];
  busy = false;
  toggleStudyUI(true);
  timerStart = Date.now();
  clearInterval(timerId);
  timerId = setInterval(() => {
    document.getElementById('timer').textContent = fmt(Date.now() - timerStart);
  }, 500);
  document.getElementById('timer').textContent = '00:00';
  hideHints();
  showCard();
}
function toggleStudyUI(on) {
  document.getElementById('mainArea').style.display = on ? '' : 'none';
  document.getElementById('bottomArea').style.display = on ? '' : 'none';
  document.getElementById('optionsRow').style.visibility = on ? '' : 'hidden';
  document.getElementById('doneArea').classList.toggle('active', !on);
}

function showCard() {
  const w = deck[idx];
  const kd = document.getElementById('kanjiDisplay');
  kd.textContent = w.jp;
  kd.classList.toggle('long', [...w.jp].length >= 6);

  const nuanceCtxEl = document.getElementById('nuanceContext');
  nuanceCtxEl.textContent = w.nuance ? '「' + w.nuance + '」' : '';

  document.getElementById('meta').innerHTML =
    w.pos + (w.star ? ' · <span class="stars">' + '★'.repeat(w.star) + '</span>' : '');

  // 예문: 【】 안 = 타깃 단어(청록 밑줄), 나머지 회색. 항상 표시
  const exEl = document.getElementById('example');
  exEl.textContent = '';
  const m = (w.ex || '').match(/^(.*?)【(.*?)】(.*)$/);
  if (m) {
    const hl = document.createElement('span');
    hl.className = 'hl'; hl.textContent = m[2];
    exEl.append(m[1], hl, m[3]);
  } else exEl.textContent = w.ex || '';

  // 한국어 힌트 = 뜻 + 예문 해석
  document.getElementById('hintKrMain').textContent = w.kr;
  document.getElementById('hintExKr').textContent = w.exKr || '';
  document.getElementById('hintRd').textContent = w.rd;

  document.getElementById('btnKr').classList.remove('revealed');
  document.getElementById('btnRd').classList.remove('revealed');

  const ci = document.getElementById('cardInner');
  ci.classList.remove('swipe-left', 'swipe-right');

  document.getElementById('btnBookmark').classList.toggle('on', bookmarks.has(cardKey(w)));
  updateProgress();
}

function updateProgress() {
  const total = deck.length;
  const done = Math.min(idx, total);
  document.getElementById('counter').textContent = Math.min(idx + 1, total) + ' / ' + total;
  document.getElementById('remain').textContent = total - done;
  document.getElementById('progressFill').style.width = (total ? done / total * 100 : 0) + '%';
  document.getElementById('progDone').textContent = '완료 ' + done;
  document.getElementById('progLeft').textContent = '남음 ' + (total - done);
}

/* ---------- 힌트 ---------- */
function hideHints() {
  ['hintKr', 'hintRd'].forEach(id => {
    document.getElementById(id).classList.remove('visible');
  });
}
function toggleHint(which) {
  const el = document.getElementById('hint' + which);
  const on = el.classList.toggle('visible');
  document.getElementById('btn' + which).classList.toggle('revealed', on);
}

/* ---------- 넘기기 ---------- */
function next(action) {
  if (busy || idx >= deck.length) return;
  busy = true;
  const w = deck[idx];

  hideHints();                                   // 1. 반드시 먼저
  document.getElementById('cardInner').classList.add(action === 'study' ? 'swipe-left' : 'swipe-right'); // 2.

  if (action === 'study') {
    if (!studyList.includes(w)) studyList.push(w);
    if (loopMode) deck.push(w);                  // ∞: 라운드 끝에 다시 등장
  } else {
    if (!knowList.includes(w)) knowList.push(w);
  }

  setTimeout(() => {                             // 3.
    idx++;
    busy = false;
    if (idx >= deck.length) showDone(); else showCard();
  }, 220);
}

function showDone() {
  clearInterval(timerId);
  updateProgress();
  document.getElementById('counter').textContent = deck.length + ' / ' + deck.length;
  toggleStudyUI(false);
  const unknownCount = loopMode ? 0 : studyList.length;
  document.getElementById('doneKnow').textContent = knowList.length;
  document.getElementById('doneStudy').textContent = studyList.length;
  document.getElementById('doneTime').textContent = '소요 시간 ' + fmt(Date.now() - timerStart);

  const retryBtn = document.getElementById('btnRetry');
  if (studyList.length > 0) {
    retryBtn.style.display = '';
    document.getElementById('retryCount').textContent = '(' + studyList.length + '장)';
  } else {
    retryBtn.style.display = 'none';
  }
}

function restart(onlyStudy) {
  const list = onlyStudy && studyList.length ? studyList.slice() : pool;
  beginRound(list);
}

/* ---------- 옵션 ---------- */
function toggleBookmark() {
  const w = deck[idx]; if (!w) return;
  const k = cardKey(w);
  if (bookmarks.has(k)) bookmarks.delete(k); else bookmarks.add(k);
  saveBookmarks();
  document.getElementById('btnBookmark').classList.toggle('on', bookmarks.has(k));
}
function toggleLoop() {
  loopMode = !loopMode;
  document.getElementById('btnLoop').classList.toggle('on', loopMode);
}
function speak() {
  const w = deck[idx]; if (!w || !window.speechSynthesis) return;
  speechSynthesis.cancel();
  const text = w.rd.split('（')[0];
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'ja-JP'; u.rate = 0.9;
  const v = speechSynthesis.getVoices().find(v => v.lang && v.lang.startsWith('ja'));
  if (v) u.voice = v;
  speechSynthesis.speak(u);
}

/* ---------- 키보드 (데스크톱) ---------- */
document.addEventListener('keydown', e => {
  if (!document.getElementById('studyScreen').classList.contains('active')) return;
  if (document.getElementById('doneArea').classList.contains('active')) return;
  if (e.repeat || e.ctrlKey || e.metaKey || e.altKey) return;
  // e.code 기준 → 한글 입력 상태(ㅂㅈㅁㄴ)에서도 동작
  const c = e.code;
  if (c === 'KeyQ' || e.key === '1') toggleHint('Kr');
  else if (c === 'KeyW' || e.key === '2') toggleHint('Rd');
  else if (c === 'KeyA' || e.key === 'ArrowLeft') next('study');
  else if (c === 'KeyS' || e.key === 'ArrowRight') next('know');
  else if (c === 'Space') { e.preventDefault(); speak(); }
  else if (c === 'KeyB') toggleBookmark();
  else return;
  e.preventDefault();
});

if (window.speechSynthesis) speechSynthesis.onvoiceschanged = () => {};
renderSelect();
</script>
